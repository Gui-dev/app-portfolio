services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foliocraft
      POSTGRES_USER: foliocraft
      POSTGRES_PASSWORD: foliocraft
    ports:
      - "5432:5432"
    volumes:
      - foliocraft_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foliocraft -d foliocraft"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foliocraft_pgdata:
